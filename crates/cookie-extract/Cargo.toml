[package]
name = "cookie-extract"
version = "0.1.1"
edition.workspace = true
description = "Decoupled cross-platform browser cookie extraction and parsing library"
readme = "README.md"
repository = "https://github.com/shadowmkj/leetrs/tree/main/crates/cookie-extract"
license.workspace = true

[dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
directories = "6.0"
hmac = "0.12"
log = "0.4"
pbkdf2 = "0.12"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
sha1 = "0.10"
tempfile = "3.10"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography"] }
