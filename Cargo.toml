[package]
name = "leetrs"
version = "1.2.2"
edition.workspace = true
description = "A command-line tool to interact with LeetCode."
homepage.workspace = true
repository.workspace = true
license.workspace = true

[workspace]
members = [
  ".",
  "crates/cookie-extract",
  "xtask",
]

[workspace.package]
edition = "2024"
homepage = "https://github.com/shadowmkj/leetrs"
repository = "https://github.com/shadowmkj/leetrs"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.6.0"
clap_complete_nushell = "4.6"
cookie-extract = { path = "crates/cookie-extract", version = "0.1.0" }
crossterm = "0.29.0"
dialoguer = "0.12.0"
directories = "6.0.0"
env_logger = "0.11"
fuzzy-matcher = "0.3.7"
html2md = "0.2.15"
log = "0.4"
open = "5.3.3"
ratatui = "0.30.0"
reqwest = { version = "0.13.2", features = ["cookies", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["full"] }
toml = "1.1.2"
tui-input = "0.15.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
opt-level = "s"
strip = true
lto = true
codegen-units = 1
